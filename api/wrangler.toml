# Cloudflare Worker: API für Mobile Home (Belegung, Anfragen, Verwaltung)
name = "mobile-home-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "mobile-home"
# Nach "npx wrangler d1 create mobile-home" die ausgegebene ID hier eintragen:
database_id = "7d551ed0-74dd-4444-b2e4-e8e35dc080db"
migrations_dir = "migrations"

# Tägliche Bereinigung (alte Anfragen löschen, Gastdaten anonymisieren) – 03:00 UTC
[triggers]
crons = ["0 3 * * *"]

[vars]
# Von welchen Seiten darf die API aufgerufen werden? (kommagetrennt, ohne Pfad)
ALLOWED_ORIGINS = "https://mobile-home-privlaka.com,https://www.mobile-home-privlaka.com,https://leon-wurster-art.github.io,http://localhost:8080"
# Link zur Verwaltungsseite (für Benachrichtigungs-Mails)
ADMIN_URL = "https://mobile-home-privlaka.com/admin/"
ZEITZONE = "Europe/Zagreb"
MAX_NAECHTE = "60"   # Obergrenze pro Anfrage (Preise & Mindestnächte: in der Verwaltung)
# Datenschutz: unbeantwortete/abgelehnte/stornierte Anfragen nach X Tagen löschen,
# Gastdaten bestätigter Buchungen X Tage nach Abreise anonymisieren
LOESCHEN_NACH_TAGEN = "180"
ANONYMISIEREN_NACH_TAGEN = "365"

# E-Mails (Eingangsbestätigung an Gäste, Benachrichtigung an die Verwaltung)
# Die Absender-Domain muss beim Mail-Dienst (Brevo oder Resend) bestätigt sein.
WEBSITE_URL = "https://mobile-home-privlaka.com"
MAIL_ABSENDER_NAME = "Mobile Home Adria"
MAIL_ABSENDER_ADRESSE = "anfrage@mobile-home-privlaka.com"
MAIL_ANTWORT_AN = "jadraleno@web.de"   # Antworten der Gäste landen hier

# Geheimnisse NICHT hier eintragen, sondern per "npx wrangler secret put NAME":
#   SESSION_SECRET   (Pflicht)  zufälliger Schlüssel zum Signieren der Logins
#   ICS_TOKEN        (optional) schützt den iCal-Export mit ?token=...
#   BREVO_API_KEY    (oder RESEND_API_KEY) Schlüssel des Mail-Dienstes – ohne ihn werden keine Mails verschickt
#   NOTIFY_TO        Empfänger der Benachrichtigung bei neuer Anfrage (kommagetrennt möglich)
