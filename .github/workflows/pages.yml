# Veröffentlicht den Ordner site/ auf GitHub Pages
name: Website veröffentlichen

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Versionskennung an CSS/JS hängen, damit Browser nach jeder Änderung sofort die neue Fassung laden
      - name: Versionskennung einsetzen
        run: |
          V="${GITHUB_SHA::8}"
          find site -name "*.html" -exec sed -i "s/__VERSION__/${V}/g" {} +
          grep -rl "__VERSION__" site && exit 1 || echo "Version ${V} eingesetzt"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
