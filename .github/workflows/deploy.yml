# Spielt Website (site/) und API (api/) automatisch zu Cloudflare aus, wenn sich etwas ändert.
# Benötigt im GitHub-Repo unter Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   (Token mit Rechten "Workers Scripts: Edit", "D1: Edit", "Workers Routes: Edit")
#   CLOUDFLARE_ACCOUNT_ID
# Solange die Secrets fehlen, wird der Lauf übersprungen (dann manuell: cd api && npm run deploy).
name: Website & API ausspielen

on:
  push:
    branches: [main]
    paths: ["site/**", "api/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Secrets vorhanden?
        if: env.CF_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN fehlt – automatisches Ausspielen übersprungen."
      - uses: actions/checkout@v4
        if: env.CF_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != ''
        with:
          node-version: 22
      - run: npm ci
        if: env.CF_TOKEN != ''
        working-directory: api
      - uses: cloudflare/wrangler-action@v3
        if: env.CF_TOKEN != ''
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: |
            d1 migrations apply mobile-home --remote
            deploy --var VERSION:${{ github.sha }}
